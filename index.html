    <style>
      @font-face { font-family: "SF Title"; src: url("fonts/LilitaOne-Regular.ttf") format("truetype"); font-display: swap; }
      @font-face { font-family: "SF Body"; src: url("fonts/VarelaRound-Regular.ttf") format("truetype"); font-display: swap; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1A1220; touch-action: none; overscroll-behavior: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; background: #1A1220; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 14px;
                padding: max(9vh, 36px) max(20px, env(safe-area-inset-right)) 24px max(20px, env(safe-area-inset-left)); box-sizing: border-box; text-align: center;
                background: radial-gradient(ellipse at 50% 62%, #2A4C7D 0%, #122744 55%, #0A1426 100%); color: #FFF6E8; font-family: "SF Body", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .5s ease-out; overflow: hidden; }
      /* Theme v2 (docs/pulido): enamel night behind molten-gold lettering, as in the game's title. */
      #loader h1 { position: relative; margin: 0; font-family: "SF Title", system-ui, sans-serif; font-weight: 400; font-size: clamp(46px, 10vmin, 96px); letter-spacing: .04em; color: #FFD866;
                   background: linear-gradient(180deg, #FFF2A8 0%, #FFD866 45%, #FF9330 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
                   filter: drop-shadow(0 4px 0 #0A1426) drop-shadow(0 0 18px rgba(255,138,42,.5)); }
      #loader > *:not(#sparks):not(.scene) { position: relative; z-index: 1; }
      /* v2o (judge: "the lower third stays empty, it reads as a web page", NOT DONE three rounds): the Home's composition
         as a vector night scene (ranges, parapet, the red banner on the left, the forge tower with its glowing mouth on the
         right), original art in inline SVG, no download. The mouth breathes unless reduced motion is on. */
      .scene { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
      #scene-bg { width: 100%; height: min(40vh, 380px); }
      #scene-fg { left: 50%; right: auto; transform: translateX(-50%); width: min(100vw, 560px); height: min(50vh, 460px); }
      #mouthGlow { animation: breathe 1.8s ease-in-out infinite alternate; }
      @keyframes breathe { from { opacity: .82; } to { opacity: 1; } }
      /* L34.5 (graph: P1, pending): sparks falling through the loader, pure CSS, no assets. Transform/opacity only, so they
         keep moving while the main thread compiles the engine. */
      #sparks { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
      #sparks i { position: absolute; top: -4vh; width: 6px; height: 6px; border-radius: 50%; background: #FFE9A0;
                  box-shadow: 0 0 6px 2px rgba(255,180,70,.9), 0 0 16px 4px rgba(255,106,42,.45); opacity: 0;
                  animation: spark-fall linear infinite; }
      @keyframes spark-fall { 0% { transform: translate(0, 0) scale(1); opacity: 0; } 8% { opacity: 1; }
                              70% { opacity: .9; } 100% { transform: translate(var(--dx, 20px), 112vh) scale(.4); opacity: 0; } }
      #tag { margin: 0; font-size: clamp(16px, 2.6vmin, 22px); font-weight: 600; }
      #hook { margin: 4px 0 0; font-size: clamp(15px, 2.4vmin, 20px); color: #FFB347; }
      #offer { margin: 0 0 10px; font-size: clamp(13px, 2vmin, 16px); color: #C9BBD6; }
      #bar { position: relative; width: min(70vw, 420px); height: 16px; border-radius: 8px; background: rgba(4,10,22,.7); overflow: hidden;
             box-shadow: inset 0 2px 4px rgba(0,0,0,.6), 0 0 0 3px #B9832F, 0 0 0 4px #5A3A10; }
      /* Field report 2026-10-21: "no mostraba el estado de carga al iniciar". While nothing measurable moves (before the
         first byte, and while the engine compiles and builds the first scene) a light sweeps the bar. It is a transform
         animation, so the compositor keeps it moving even when the main thread is busy compiling. */
      #bar.busy::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 8px;
                         background: linear-gradient(90deg, rgba(255,216,102,0), rgba(255,216,102,.65), rgba(255,216,102,0));
                         animation: sweep 1.1s linear infinite; }
      @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      #fill { width: 0%; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #FF6A2A, #FFD866); transition: width .2s ease-out; }
      #msg { font-size: 15px; opacity: .8; min-height: 1.2em; font-variant-numeric: tabular-nums; }
      /* v2m: opaque enamel card (judge v2l: web widget). v2n (judge v2m: in a brass ring it looked like a button): a quiet
         dark band without a frame, a caption rather than a control. */
      #tip { width: min(86vw, 460px); min-height: 3.6em; margin-top: 10px; padding: 12px 18px; box-sizing: border-box; border-radius: 12px;
             background: rgba(6, 14, 30, .72); color: #E9DFCF;
             font-size: clamp(14px, 2.2vmin, 17px); line-height: 1.4; white-space: pre-line; text-align: center; transition: opacity .3s ease-out; }
      #err { display: none; flex-direction: column; align-items: center; gap: 12px; max-width: 460px; }
      #err p { margin: 0; font-size: 17px; line-height: 1.4; }
      #err small { opacity: .55; font-size: 12px; word-break: break-word; }
      #retry { min-width: 180px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 26px; background: #FF8A2A; color: #1A1220; font: 700 18px system-ui, sans-serif; cursor: pointer; }
      #loader.failed #bar, #loader.failed #msg, #loader.failed #tip { display: none; }
      #loader.failed #err { display: flex; }
      @media (prefers-reduced-motion: reduce) { #loader, #fill, #tip { transition: none; } #bar.busy::after { animation: none; opacity: .5; left: 30%; } #sparks { display: none; } #mouthGlow { animation: none; } }

      <h1>SPARKFALL</h1>
      <p id="tag">Vierte chispas. Forja reliquias. Resiste la oleada.</p>
      <p id="hook">Cada enemigo que cae vuelve a tu crisol</p>
      <p id="offer">Un capítulo completo, sin anuncios ni compras</p>

    <script>
      // Text first (this runs before the engine is even requested), in the browser's language.
      // The tips are the exact tut.pour1..3 strings of the in-game tutorial (Scripts/Core/Loc.cs).
      var L = {
        es: { tag: "Vierte chispas. Forja reliquias. Resiste la oleada.", hook: "Cada enemigo que cae vuelve a tu crisol",
              offer: "Un capítulo completo, sin anuncios ni compras", loading: "Cargando la forja…", starting: "Encendiendo la forja…",
              error: "No se pudo iniciar el juego. Comprueba tu conexión y vuelve a intentarlo.", retry: "Reintentar",
              tips: ["Arrastra por la barra dorada\ny suelta para verter.",
                     "Los moldes ×N multiplican chispas.\nLos sumideros −N las devoran.",
                     "Los prismas cargan tus Descargas.\nGolpea la campana para ganar una Ficha de Forja."] },
        en: { tag: "Pour sparks. Forge relics. Hold the line.", hook: "Every enemy that falls returns to your crucible",
              offer: "A full chapter, no ads, no purchases", loading: "Loading the forge…", starting: "Lighting the forge…",
              error: "The game could not start. Check your connection and try again.", retry: "Retry",
              tips: ["Drag along the gold bar\nand release to pour.",
                     "×N molds multiply sparks.\n−N drains devour them.",
                     "Prisms charge your Surges.\nRing the bell to earn a Forge Token."] }
      };
      var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || "es").toLowerCase();
      var es = /^(es|ca|eu|gl)\b/.test(lang);
      var T = es ? L.es : L.en;
      document.documentElement.lang = es ? "es" : "en";
      function $(id) { return document.getElementById(id); }
      $("tag").textContent = T.tag; $("hook").textContent = T.hook; $("offer").textContent = T.offer;
      $("msg").textContent = T.loading + " 0 %"; $("retry").textContent = T.retry;
      var tipEl = $("tip"), tipIndex = 0;
      tipEl.textContent = T.tips[0];
      var tipTimer = setInterval(function () {
        tipEl.style.opacity = "0";
        setTimeout(function () { tipIndex = (tipIndex + 1) % T.tips.length; tipEl.textContent = T.tips[tipIndex]; tipEl.style.opacity = "1"; }, 300);
      }, 3000);
      $("retry").addEventListener("click", function () { location.reload(); });
    </script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var fill = document.querySelector("#fill");
      var bar = document.querySelector("#bar");
      var msg = document.querySelector("#msg");
      function fail(detail) {
        clearInterval(tipTimer);
        $("errText").textContent = T.error;
        $("errDetail").textContent = detail ? String(detail).slice(0, 200) : "";
        loader.classList.add("failed");
        console.error(detail);
      }
      // Field report 2026-10-21 ("no mostraba el estado de carga al iniciar"). Unity's own progress needs a Content-Length
      // on every file: without one (some proxies and compressing CDNs; tools/webtest/server.mjs NO_LENGTH=1) it jumped
      // to 90 % at once and the bar stood still for the whole download. The page also counts the engine's bytes itself
      // (fetch wrapper below) and shows megabytes when no total is known.
      var dl = { got: 0, total: 0, unknown: 0, open: 0, seen: {} }, unityPct = 0;
      function mb(b) { var t = (b / 1048576).toFixed(1); return (es ? t.replace(".", ",") : t) + " MB"; }
      function render() {
        var pct = unityPct;
        if (dl.total > 0 && !dl.unknown) pct = Math.max(pct, Math.min(90, Math.round(90 * dl.got / dl.total)));
        var downloading = dl.open > 0;
        if (downloading && dl.unknown > 0) pct = 0;   // no total: the sweep carries the motion, the text the megabytes
        fill.style.width = pct + "%";
        bar.setAttribute("aria-valuenow", pct);
        // Nothing measurable moves before the first byte, while the size is unknown and while the engine starts.
        bar.classList.toggle("busy", pct <= 0 || (downloading && dl.unknown > 0) || (!downloading && pct >= 90));
        if (downloading && dl.unknown > 0) msg.textContent = T.loading + " " + mb(dl.got);
        else if (downloading || pct < 90) msg.textContent = T.loading + " " + Math.min(pct, 90) + " %";
        else msg.textContent = T.starting;
      }
      function progress(p) { unityPct = Math.max(0, Math.min(100, Math.round(p * 100))); render(); }
      if (window.fetch && window.ReadableStream && window.Response) {
        var baseFetch = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : (input && input.url) || "";
          var req = baseFetch.apply(this, arguments);
          if (!/Build\/[^?#]*\.unityweb/.test(url)) return req;
          return req.then(function (res) {
            try {
              if (!res.ok || !res.body || dl.seen[url]) return res;
              dl.seen[url] = true;
              var len = parseInt(res.headers.get("Content-Length"), 10);
              if (len > 0) dl.total += len; else dl.unknown++;
              dl.open++;
              var reader = res.body.getReader(), closed = false;
              var done = function () { if (!closed) { closed = true; dl.open--; render(); } };
              var body = new ReadableStream({
                pull: function (c) {
                  return reader.read().then(function (r) {
                    if (r.done) { done(); c.close(); return; }
                    dl.got += r.value.byteLength;
                    render();
                    c.enqueue(r.value);
                  }, function (e) { done(); c.error(e); });
                },
                cancel: function (why) { done(); return reader.cancel(why); }
              });
              return new Response(body, { status: res.status, statusText: res.statusText, headers: res.headers });
            } catch (e) { return res; }
          });
        };
      }
      // The loader stays until the game has drawn its first frames (the jslib raises "sparkfall-ready"), not only until
      // the engine exists: on phones the first scene can take seconds after that and the screen used to stay empty.
      var shown = false;
      function reveal() {
        if (shown) return;
        shown = true;
        clearInterval(tipTimer);
        loader.style.opacity = "0";
        setTimeout(function () { loader.remove(); }, 600);
        canvas.focus();
      }
      window.addEventListener("sparkfall-ready", reveal);
      // Field reports (iPhone Safari). At the full devicePixelRatio (3 on iPhones, about 2.5 million pixels a frame
      // with bloom) it was "very laggy"; capped at 1.5 it ran smoothly on an iPhone 15 but looked "much worse". So the
      // page starts at 2 (2.25x fewer pixels than 3, crisp text) and the game steps down only when frames run slow:
      // 3D resolution first, then this ratio to 1.5 (AdaptiveResolution). ?dpr=N overrides the cap for tests.
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var dprArg = /[?&]dpr=([0-9.]+)/.exec(location.search);
      if (dprArg) dpr = Math.max(0.5, Math.min(4, parseFloat(dprArg[1])));
      function start() {
        createUnityInstance(canvas, {
          arguments: [],
          devicePixelRatio: dpr,
          dataUrl: "Build/web.data.unityweb",
          frameworkUrl: "Build/web.framework.js.unityweb",
          codeUrl: "Build/web.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Sparkfall Studio",
          productName: "Sparkfall",
          productVersion: "1.0.0",
        }, progress)
        .then(function (instance) {
          window.sparkfall = instance;
          // Cup Heroes study CH3a.13: save when the tab is hidden or closed (mobile browsers may kill a background tab
          // without any further event; Unity's OnApplicationPause is not raised for a hidden tab).
          var persist = function () { try { instance.SendMessage('GameRoot', 'WebCmd', 'persist'); } catch (e) {} };
          document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persist(); });
          window.addEventListener('pagehide', persist);
          msg.textContent = T.starting;
          bar.classList.add("busy");
          setTimeout(reveal, 20000);   // an older cached build never raises the event
        })
        .catch(fail);
      }
      // The engine loader is requested after the text has been painted (no parser-blocking script).
      var s = document.createElement("script");
      s.src = "Build/web.loader.js";
      s.onload = start;
      s.onerror = function () { fail("loader: " + s.src); };
      document.body.appendChild(s);
    </script>
